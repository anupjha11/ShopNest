  type: formdata
  content:
    - type: text
      key: name
      value: Product Name 1
    - type: text
      key: description
      value: "Product Description "
    - type: text
      key: price
      value: "99"
    - type: text
      key: category
      value: Electronics
    - type: text
      key: stock
      value: "50"
    - type: file
      key: image
      src:
        - /C:/Users/LENOVO/Downloads/244987_2550267.jpg
auth:
  type: bearer
  credentials:
    token: ""
order: 3000
