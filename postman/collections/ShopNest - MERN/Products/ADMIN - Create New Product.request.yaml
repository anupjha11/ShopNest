$kind: http-request
name: ADMIN -- Create New Product
description: "Generated from cURL: curl --location 'http://localhost:5000/api/products' \\\r

  --header 'Authorization: Bearer YOUR_TOKEN_HERE' \\\r

  --form 'name=\"Product Name\"' \\\r

  --form 'description=\"Product Description\"' \\\r

  --form 'price=\"99.99\"' \\\r

  --form 'category=\"Electronics\"' \\\r

  --form 'stock=\"50\"' \\\r

  --form 'image=@\"/path/to/image.jpg\"'"
url: http://localhost:5000/api/products/
method: POST
headers:
  Authorization: Bearer YOUR_TOKEN_HERE
